# =====================================================================
#  MANIFIESTO DE INSUMOS - Robot Precia
# =====================================================================
# Transcrito de las imagenes del Excel "Descarga archivos precia 1".
# Cada insumo se ubica en su seccion del portal, se selecciona la fecha
# objetivo (t-1; los lunes tambien el fin de semana), se filtra/pagina si
# aplica, y se descarga la fila cuyo nombre empieza por 'prefijo'.
#
# Campos:
#   categoria : agrupacion de negocio (informativo)
#   prefijo   : texto con el que EMPIEZA el nombre del archivo en la tabla
#               (tras seleccionar la fecha, la tabla solo muestra esa fecha,
#                asi que basta el prefijo para ubicar la fila)
#   patron    : patron del nombre con token de fecha, para validar/renombrar
#               ({MMDDYY} | {DDMMYY} | {YYYY_MM_DD}); best-effort, CONFIRMAR
#   area      : menu superior del portal (Clientes ...)
#   seccion   : sub-seccion / boton dentro del area
#   pagina    : pagina de la tabla donde aparece (1 o 2)
#   filtro    : texto a escribir en el filtro de la tabla (o null)
#
# TOTAL declarado en el Excel: 43 (verificar contra el Excel real).
# =====================================================================

