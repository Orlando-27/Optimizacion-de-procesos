# =====================================================================
#  EJEMPLO YA DILIGENCIADO PARA PRODUCCIÓN
# ---------------------------------------------------------------------
#  Cuando estés en la oficina y quieras dejar el robot en PRODUCCIÓN:
#    1. Copia este archivo sobre el real:   parametros.ejemplo.yaml -> parametros.yaml
#       (o abre parametros.yaml y pega este contenido).
#    2. Reemplaza la RUTA de red (carpeta_destino.prod) por la real.
#    3. Ajusta la lista de receptores si deben recibir más personas.
#    4. Guarda y ejecuta.  ¡Listo!
# =====================================================================

# En producción va en "prod" (ruta de red real + envía el correo por Outlook).
entorno: "prod"

# --- Carpeta donde se guardan los insumos --------------------------------
carpeta_destino:
  test: "./insumos"
  # Por ahora, la carpeta "insumos" dentro del motor. Cuando tengas la carpeta
  # de red compartida, cámbiala por la ruta UNC real, LA MISMA en las dos
  # máquinas. IMPORTANTE: usa comillas SIMPLES para rutas de Windows (los \ van
  # tal cual, sin duplicar). Ejemplo:
  #   prod: '\\SERVIDOR\COB\Gerencia Estrategia\Analisis Cuantitativo\BDatos\INSUMOS_PRECIA'
  prod: "./insumos"

# --- Quién ENVÍA el correo (buzón de Outlook en las máquinas) ------------
remitente: "jbobadilla@colfondos.com.co"

# --- Quiénes RECIBEN el correo (reporte diario + alertas) ----------------
receptores:
  test:
    - "jbobadilla@colfondos.com.co"
  prod:
    - "jbobadilla@colfondos.com.co"
    # - "otra.persona@colfondos.com.co"   # agrega más con "  - " si hace falta

# --- Copia (CC), opcional ------------------------------------------------
copia_cc:
  test: []
  prod: []
