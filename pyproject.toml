[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-procesos"
version = "0.1.0"
description = "Motor de Optimizacion de Procesos - Proceso 001: impugnacion_rfl"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "holidays>=0.45",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "selenium>=4.18",
    "keyring>=24.0",
]

[project.optional-dependencies]
# Solo necesario en el equipo Windows de produccion (Outlook/Excel COM).
windows = ["pywin32>=306"]
# Inspeccion del VBA de la macro original.
macro = ["oletools>=0.60"]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.9"]

[tool.setuptools.packages.find]
include = ["core*", "procesos*"]

[tool.pytest.ini_options]
testpaths = ["procesos"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
